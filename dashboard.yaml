# MU-TH-UR 6000 dashboard. See README.md. Search for YOUR_ and the entity IDs below and swap in your own.
views:
- title: MU-TH-UR
  path: mother
  type: sections
  max_columns: 3
  background: '#060706'
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: markdown
      content: "# MU-TH-UR\n\n### 6000\n\n<img src=\"/local/mother-logo.png\" alt=\"Logo\">\n\n{% set zha = integration_entities('zha') | select('is_state','unavailable') | map('device_id') | reject('none') | unique | list | count -%}\n{% set cams = ['camera.front_door','camera.garden','camera.hall'] | select('is_state','unavailable') | list | count -%}\n{% set faults = zha + cams + (1 if is_state('binary_sensor.YOUR_WAN_STATUS','off') else 0) -%}\nHOUSE SYSTEMS INTERFACE // {{ now().strftime('%a %d %b %Y').upper() }} // {{ now().strftime('%H:%M') }}  \n{# EDIT THIS LIST: ('NAME TO SHOW', 'person.entity') #}\n{% set crew = [('DALLAS','person.dallas'),('KANE','person.kane'),('RIPLEY','person.ripley'),('LAMBERT','person.lambert')] -%}\n{% set ns = namespace(on=[], off=[]) -%}\n{% for n, e in crew %}{% if is_state(e,'home') %}{% set ns.on = ns.on + [n] %}{% else %}{% set ns.off = ns.off + [n] %}{% endif %}{% endfor -%}\nCREW STATUS.......... {{ ns.on | count }}/{{ crew | count }} ABOARD{{ (': ' ~ ns.on | join(', ')) if ns.on else '' }}{{ (' // **OFF-SHIP: ' ~ ns.off | join(', ') ~ '**') if ns.off else '' }}  \nSYSTEM STATUS........ {{ 'ALL SYSTEMS NOMINAL' if faults == 0 else '**' ~ faults ~ ' FAULT(S) DETECTED**' }}  \n&gt; INTERFACE READY FOR INQUIRY"
      card_mod:
        style:
          .: 'ha-card{--ha-font-family-body:''Courier Prime'',monospace;--ha-font-family-heading:''Courier Prime'',monospace;--mdc-typography-font-family:''Courier Prime'',monospace;--primary-text-color:#39f03c;--secondary-text-color:#26a82a;--primary-color:#39f03c;--state-icon-color:#39f03c;--state-inactive-color:#2bc42e;background:#0e100e !important;border:3px solid #2bc42e !important;border-radius:0 !important;box-shadow:0 0 14px rgba(57,240,60,.18),inset 0 0 40px rgba(57,240,60,.06) !important;color:#39f03c !important;font-family:''Courier Prime'',monospace !important;letter-spacing:0;text-shadow:0 0 3px rgba(57,240,60,.55),1px 0 0 rgba(57,240,60,.25);position:relative;overflow:hidden}ha-card::after{content:'''';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.38) 0 2px,transparent 2px 4px)}*{font-family:''Courier Prime'',monospace !important}h1{font-size:58px !important;font-weight:700;letter-spacing:5px;color:#39f03c !important;text-align:center;line-height:1;margin:6px 0 8px;text-shadow:0 0 8px rgba(57,240,60,.7),2px 0 0 rgba(57,240,60,.35)}h3{display:table;margin:0 auto 12px;background:#39f03c;color:#0e100e !important;font-size:26px;font-weight:700;letter-spacing:10px;padding:2px 8px 2px 18px;line-height:1.2;text-shadow:none;box-shadow:0 0 10px rgba(57,240,60,.6)}img{display:block;margin:2px auto 14px;width:62%;max-width:360px;height:auto;filter:drop-shadow(0 0 5px rgba(57,240,60,.55))}p{margin:0;font-size:17px;line-height:1.5}strong{color:#ffd35d;font-weight:400;text-shadow:0 0 6px rgba(255,211,93,.7)}p:last-child::after{content:''█'';margin-left:6px;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}'
          ha-markdown $: '*{font-family:''Courier Prime'',monospace !important}h1{font-size:58px !important;font-weight:700;letter-spacing:5px;color:#39f03c !important;text-align:center;line-height:1;margin:6px 0 8px;text-shadow:0 0 8px rgba(57,240,60,.7),2px 0 0 rgba(57,240,60,.35)}h3{display:table;margin:0 auto 12px;background:#39f03c;color:#0e100e !important;font-size:26px;font-weight:700;letter-spacing:10px;padding:2px 8px 2px 18px;line-height:1.2;text-shadow:none;box-shadow:0 0 10px rgba(57,240,60,.6)}img{display:block;margin:2px auto 14px;width:62%;max-width:360px;height:auto;filter:drop-shadow(0 0 5px rgba(57,240,60,.55))}p{margin:0;font-size:17px;line-height:1.5}strong{color:#ffd35d;font-weight:400;text-shadow:0 0 6px rgba(255,211,93,.7)}p:last-child::after{content:''█'';margin-left:6px;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}'
      grid_options:
        columns: 18
    - type: markdown
      content: "## [ ATTENTION REQUIRED ]\n\n{% macro row(l, v) -%}{{ l }}{{ '.' * (14 - l|length) }} {{ v }}  {% endmacro -%}\n{% set cams = {'camera.front_door':'FRONT DOOR','camera.garden':'GARDEN','camera.hall':'HALL'} -%}\n{% set f = namespace(l=[]) -%}\n{% if is_state('binary_sensor.YOUR_WAN_STATUS','off') %}{% set f.l = f.l + [row('UPLINK', 'INTERNET CONNECTION LOST')] %}{% endif -%}\n{% for e, n in cams.items() if is_state(e,'unavailable') %}{% set f.l = f.l + [row('CAMERA', n ~ ' OFFLINE')] %}{% endfor -%}\n{% for i in integration_entities('zha') | select('is_state','unavailable') | map('device_id') | reject('none') | unique %}{% set f.l = f.l + [row('ZIGBEE', (device_attr(i,'name_by_user') or device_attr(i,'name')) | upper ~ ' SILENT')] %}{% endfor -%}\n{# battery sensors you do not care about go in this list #}\n{% set ignore = [] -%}\n{% set a = namespace(l=[]) -%}\n{% for s in states.sensor if s.entity_id not in ignore and s.attributes.device_class is defined and s.attributes.device_class == 'battery' and s.state | is_number and s.state | float < 25 %}{% set a.l = a.l + [row('BATTERY', s.name | replace(' Battery','') | upper ~ ' ' ~ (s.state | float | round(0) | int) ~ '%')] %}{% endfor -%}\n{% for s in states.binary_sensor if s.entity_id not in ignore and s.attributes.device_class is defined and s.attributes.device_class == 'battery' and s.state == 'on' %}{% set a.l = a.l + [row('BATTERY', s.name | replace(' Battery','') | upper ~ ' LOW')] %}{% endfor -%}\n{% for s in states.update | selectattr('state','eq','on') %}{% set a.l = a.l + [row('UPDATE', s.name | replace(' Firmware','') | upper ~ ' ' ~ (s.attributes.latest_version or ''))] %}{% endfor -%}\n{% for s in states.automation | selectattr('state','eq','unavailable') %}{% set a.l = a.l + [row('AUTOMATION', s.name | upper ~ ' BROKEN')] %}{% endfor -%}\n{% if states('sensor.system_monitor_disk_usage') | float(0) > 80 %}{% set a.l = a.l + [row('STORAGE', states('sensor.system_monitor_disk_usage') ~ '% FULL')] %}{% endif -%}\n{% if states('sensor.system_monitor_processor_temperature') | float(0) > 75 %}{% set a.l = a.l + [row('CORE TEMP', states('sensor.system_monitor_processor_temperature') ~ 'C HIGH')] %}{% endif -%}\n<em>&gt; FAULTS ({{ f.l | count }})</em>  \n{% for l in f.l %}**{{ l }}**  \n{% else %}NONE  \n{% endfor %}\n<em>&gt; ADVISORIES ({{ a.l | count }})</em>  \n{% for l in a.l %}{{ l }}  \n{% else %}NONE  \n{% endfor %}"
