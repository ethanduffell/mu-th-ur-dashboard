        style:
          .: 'ha-card{--ha-font-family-body:''Courier Prime'',monospace;--ha-font-family-heading:''Courier Prime'',monospace;--mdc-typography-font-family:''Courier Prime'',monospace;--primary-text-color:#39f03c;--secondary-text-color:#26a82a;--primary-color:#39f03c;--state-icon-color:#39f03c;--state-inactive-color:#2bc42e;background:#0e100e !important;border:3px solid #2bc42e !important;border-radius:0 !important;box-shadow:0 0 14px rgba(57,240,60,.18),inset 0 0 40px rgba(57,240,60,.06) !important;color:#39f03c !important;font-family:''Courier Prime'',monospace !important;letter-spacing:0;text-shadow:0 0 3px rgba(57,240,60,.55),1px 0 0 rgba(57,240,60,.25);position:relative;overflow:hidden}ha-card::after{content:'''';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.38) 0 2px,transparent 2px 4px)}*{font-family:''Courier Prime'',monospace !important}h2{color:#8dff8d;font-size:20px;font-weight:700;letter-spacing:1px;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid #2bc42e}p{margin:0;font-size:17px;line-height:1.5}strong{color:#ffd35d;font-weight:400;text-shadow:0 0 6px rgba(255,211,93,.7)}em{color:#26a82a;font-style:normal}'
          ha-markdown $: '*{font-family:''Courier Prime'',monospace !important}h2{color:#8dff8d;font-size:20px;font-weight:700;letter-spacing:1px;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid #2bc42e}p{margin:0;font-size:17px;line-height:1.5}strong{color:#ffd35d;font-weight:400;text-shadow:0 0 6px rgba(255,211,93,.7)}em{color:#26a82a;font-style:normal}'
      grid_options:
        columns: 18
    - type: markdown
      content: "## [ NAVIGATION // USCSS NOSTROMO 180924609 ]\n\n{% macro row(l, v) -%}{{ l }}{{ '.' * (19 - l|length) }} {{ v }}  {% endmacro -%}\n{% set secs = now().hour * 3600 + now().minute * 60 -%}\n{% set rng = ((86400 - secs) * 4.7 + 1350) | int -%}\n{% set day = ((as_timestamp(now()) - as_timestamp('2026-01-01T00:00:00+00:00')) / 86400) | int + 1 -%}\n{% set lightyr = 39.17 - day * 0.0003 -%}\n<table><tr><td>\n{{ row('VESSEL', 'USCSS NOSTROMO') }}<br>\n{{ row('CLASS', 'M-CLASS STARFREIGHTER') }}<br>\n{{ row('CARGO', '20,000,000 TONNES ORE') }}<br>\n{{ row('ORIGIN', 'THEDUS') }}<br>\n{{ row('DESTINATION', 'EARTH') }}<br>\n{{ row('SHIP DATE', now().strftime('%d %b').upper() ~ ' 2122') }}\n</td><td>\n{{ row('POSITION', 'ZETA II RETICULI') }}<br>\n{{ row('DIST. FROM EARTH', '%.2f'|format(lightyr) ~ ' LY') }}<br>\n{{ row('RANGE TO LV-426', '{:,}'.format(rng) ~ ' KM') }}<br>\n{{ row('ETA EARTH', '10 MONTHS (REVISED)') }}<br>\n{{ row('CREW', '7 // REVIVED') }}<br>\n{{ row('MISSION DAY', day) }}\n</td></tr></table>\n\n<em>&gt; CURRENT DIRECTIVE // PRIORITY ONE</em>  \n**COURSE DIVERTED. INVESTIGATE TRANSMISSION OF UNKNOWN ORIGIN DETECTED ON LV-426.**  \nCONTRACT CLAUSE IN FORCE: ALL SIGNALS OF POSSIBLE INTELLIGENT ORIGIN MUST BE INVESTIGATED. CREW SHARES FORFEIT ON NON-COMPLIANCE.  \n&gt; PREPARE FOR ATMOSPHERIC DESCENT"
